version: '3.8'

services:
  jarvis-api:
    build: .
    container_name: jarvis-api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./logs:/app/logs
      - ./modules:/app/modules:ro
    restart: unless-stopped
    networks:
      - jarvis-network

  jarvis-frontend:
    image: node:18-alpine
    container_name: jarvis-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://jarvis-api:5000/api
    volumes:
      - ./jarvis-frontend:/app
      - /app/node_modules
    command: npm start
    depends_on:
      - jarvis-api
    restart: unless-stopped
    networks:
      - jarvis-network

networks:
  jarvis-network:
    driver: bridge
