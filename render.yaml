# Render Blueprint - Single Full Stack Service
# https://render.com/docs/blueprint-spec

services:
  # Full Stack Service (Backend serves Frontend)
  - type: web
    name: jarvis
    runtime: python
    buildCommand: cd $RENDER_GIT_REPO_DIR/jarvis-frontend && npm install && npm run build && cd $RENDER_GIT_REPO_DIR/jarvis-ai && pip install -r requirements-render.txt
    startCommand: cd $RENDER_GIT_REPO_DIR/jarvis-ai && gunicorn api_server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20
    healthCheckPath: /api/health
    plan: free
